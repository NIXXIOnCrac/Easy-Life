[project]
name = "pc-rituals"
version = "0.1.0"
description = "PC Rituals - Windows automation app that runs sequences of PC actions"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.5",
    "qrcode>=7.4",
    "pillow>=10.0",
    "python-multipart>=0.0.9",
    "cryptography>=42.0",
]

[project.optional-dependencies]
windows = ["psutil>=5.9", "pywin32>=306"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.scripts]
pcrituals = "pcrituals.api:run"

[tool.hatch.build.targets.wheel]
packages = ["pcrituals"]